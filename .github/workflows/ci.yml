name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS: the shell, desktop install and folder picker tests exercise macOS behavior (tmux, APFS, osascript)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install tmux (the shell tests need it)
        run: command -v tmux >/dev/null || brew install tmux

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server, web and desktop
        run: pnpm typecheck

      - name: Test server, web, shared, desktop and scripts
        run: pnpm test

      - name: Build the web UI
        run: pnpm build:web

      # apps/mobile is its own npm package root. Its tests compare generated bundles with the
      # packages apps/web installed above, so this step runs after the pnpm install.
      - name: Install the Android app dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/mobile

      - name: Typecheck the Android app
        run: npx tsc --noEmit -p .
        working-directory: apps/mobile

      - name: Test the Android app
        run: node --test 'src/**/*.test.ts' 'scripts/**/*.test.mts'
        working-directory: apps/mobile
