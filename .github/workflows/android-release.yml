# Builds the public Android APK and attaches it to the GitHub Release of the tag.
#
#   git tag v0.1.1 && git push origin v0.1.1     the tag is the version (v<major>.<minor>.<count>)
#   Actions > Android release > Run workflow      builds the same for a tag name typed in (the
#                                                 tag is created at the chosen commit when it is new)
#
# The APK has the public defaults: package dev.maru.app, OTA updates off (no MARU_UPDATES_URL), no
# font CDN. MARU_RELEASES_REPO is this repository, so the installed app reads the repository's latest
# release for a newer version and offers its APK. versionName is the tag's version and versionCode its
# count, which must grow with every tag (Android installs an update only over a lower versionCode).
#
# Signing needs four repository secrets (apps/mobile/README.md, "Release signing"):
#   MARU_ANDROID_KEYSTORE_BASE64    the keystore file, base64
#   MARU_ANDROID_KEYSTORE_PASSWORD  the keystore's password
#   MARU_ANDROID_KEY_ALIAS          the key's alias in it
#   MARU_ANDROID_KEY_PASSWORD       the key's password
# Without all four the run stops before building.
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, v<major>.<minor>.<count> (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG_INPUT: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag and the signing secrets
        id: meta
        env:
          KEYSTORE_BASE64: ${{ secrets.MARU_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MARU_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARU_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARU_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not v<major>.<minor>.<count> (for example v0.1.1)"
            exit 1
          fi
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing MARU_ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing MARU_ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing MARU_ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing MARU_ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing. See apps/mobile/README.md, Release signing."
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: Install the app's packages
        working-directory: apps/mobile
        run: npm ci

      - name: Write the signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.MARU_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MARU_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARU_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARU_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/maru-sign"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/maru-sign/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/maru-sign/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >"$RUNNER_TEMP/maru-sign/keystore.properties"
          # The empty build settings file keeps the build on the public defaults.
          : >"$RUNNER_TEMP/maru-sign/build.env"

      - name: Build the APK
        env:
          MARU_BUILD_ENV: ${{ runner.temp }}/maru-sign/build.env
          MARU_ANDROID_KEYSTORE_PROPERTIES: ${{ runner.temp }}/maru-sign/keystore.properties
          MARU_MOBILE_DIR: ${{ runner.temp }}/maru-out
          MARU_ANDROID_BUILD_DIR: ${{ runner.temp }}/maru-android-build
          MARU_VERSION: ${{ steps.meta.outputs.version }}
          MARU_RELEASES_REPO: ${{ github.repository }}
          # No MARU_UPDATES_URL, MARU_ANDROID_PACKAGE or MARU_FONT_CDN: the public defaults.
        run: apps/mobile/scripts/build-apk.sh

      - name: Name the APK and write its checksum
        id: asset
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/maru-out/apk"
          src="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).file)' "$out/latest.json")"
          name="maru-${{ steps.meta.outputs.version }}.apk"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$out/$src" "$RUNNER_TEMP/release/$name"
          (cd "$RUNNER_TEMP/release" && sha256sum "$name" >"$name.sha256" && cat "$name.sha256")
          echo "dir=$RUNNER_TEMP/release" >>"$GITHUB_OUTPUT"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET_DIR: ${{ steps.asset.outputs.dir }}
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "maru ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$ASSET_DIR/$ASSET_NAME" "$ASSET_DIR/$ASSET_NAME.sha256" --clobber
